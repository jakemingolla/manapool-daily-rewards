[project]
name = "manapool-daily-rewards"
version = "0.1.0"
description = "Browserless automation for claiming the Mana Pool Daily Reward."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
manapool = "manapool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manapool"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
files = ["src"]
strict = true
